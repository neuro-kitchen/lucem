# Builds the documentation site (docs/, Starlight) with Bun, and deploys it to GitHub Pages
# (https://neuro-kitchen.github.io/lucem/) from main, with the viewer (the app in a browser, on
# its own: the files you pick, the samples) at /lucem/viewer/ (app/lucem-app-web/build.sh: the
# app, its engine worker and the samples; nightly Rust, pinned in build.sh). As dsp-kitchen's.
# Pull requests that touch the site get the build only.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "app/lucem-app-web/**"
      - "engine/lucem-engine-web/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege: read the code; the deploy job adds what Pages needs.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Build the app for the browser
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (nightly, wasm-bindgen of Cargo.lock's version, binaryen, brotli)
        run: |
          toolchain=$(sed -n 's/^TOOLCHAIN="${LUCEM_WEB_TOOLCHAIN:-\(nightly-[0-9-]*\)}"$/\1/p' app/lucem-app-web/build.sh)
          rustup toolchain install "$toolchain" --profile minimal --component rust-src --target wasm32-unknown-unknown
          bindgen=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$bindgen" --locked
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends brotli
          # binaryen from its release, pinned: Ubuntu's package is too old for the module's
          # features (bulk memory, threads)
          curl -sSfL -o /tmp/binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz
          echo "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc  /tmp/binaryen.tgz" | sha256sum -c -
          tar -xzf /tmp/binaryen.tgz -C /tmp && echo /tmp/binaryen-version_130/bin >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Shared with release.yml's page build; saved from main only (a pull request reads it)
          shared-key: web-page
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build (the app, its engine worker, the samples)
        run: app/lucem-app-web/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app
          path: app/lucem-app-web/dist
          if-no-files-found: error

  build:
    name: Build the site
    needs: app
    # A pull request builds the site alone (no app job then)
    if: ${{ !cancelled() && (needs.app.result == 'success' || needs.app.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: docs/package.json
      - name: Install
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: docs
        run: bun --bun run build
      # The viewer at /lucem/viewer/ (Pages serves no Brotli files: the plain ones are enough)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name != 'pull_request'
        with:
          name: web-app
          path: docs/dist/viewer
      - name: Leave out the compressed copies
        if: github.event_name != 'pull_request'
        run: find docs/dist/viewer -name '*.br' -delete
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
