# Release on a version tag (v0.0.2, ...), as dsp-kitchen and kitchen do. The Python packages are
# built and published only when the repository variable `PUBLISH_PYPI` is `true` (their PyPI
# trusted publishers and environments set up); otherwise the crates and the GitHub release go out
# alone.
#
# Check the tag against the workspace version, package the publishable crates and build the Python wheels and sdist, then publish to
# crates.io and PyPI through trusted publishing (no stored tokens). The publish jobs run in the
# GitHub environments `crates-io` and `pypi`, which only accept `v*` tags and wait for a required
# reviewer's approval (the app and each model plugin publish from their own: `pypi-app`,
# `pypi-ml-stardist`, `pypi-ml-sam`, `pypi-ml-instanseg`); the registries only accept tokens from this workflow and
# those environments. Then the GitHub release of the tag, with this version's CHANGELOG.md section as
# its notes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check version and package crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Link with mold (faster than the default linker)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      # ci.yml's workspace cache, saved by the push to main this tag points at (read only here)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: workspace
          cache-directories: ~/.local/share/tracel
          save-if: false
      # The workspace includes the GPUI app (not published); resolving and checking it needs these
      - name: System libraries for GPUI
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - name: Tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lucem-core") | .version')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != workspace version ${version}"; exit 1; }
      - name: CHANGELOG.md has this version's section
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: lucem's extras and lucem-web pin this version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lucem-core") | .version')
          wrong=$(grep -oE '"lucem-[a-z-]+==[^"]+"' bindings/python/pyproject.toml | grep -v "==${version}\"" || true)
          test -z "$wrong" || { echo "bindings/python/pyproject.toml pins $wrong, the workspace is ${version}"; exit 1; }
          grep -q "^version = \"${version}\"$" bindings/python/wheels/lucem-web/pyproject.toml || { echo "bindings/python/wheels/lucem-web/pyproject.toml version != ${version}"; exit 1; }
      - name: Package and verify the publishable crates
        run: cargo publish --dry-run --workspace
      # Nothing is published with a known vulnerability, a yanked crate or a licence not allowed
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check

  # The Python packages (`bindings/python`): `lucem` (core) and `lucem-hist` (histology). abi3,
  # so one wheel per platform serves every CPython >= 3.12. ML model plugins (`lucem-ml-*`) ship
  # as Rust binaries rather than PyPI wheels.
  wheels:
    name: Wheel ${{ matrix.wheel }} (${{ matrix.os }})
    needs: check
    if: vars.PUBLISH_PYPI != 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # HIP (AMD): Linux only in cubecl-hip; compiled in, not run (no AMD GPU to test on)
          - { os: ubuntu-latest, target: x86_64, project: bindings/python, wheel: lucem, features: "extension-module,wgpu,cuda,hip,cpu" }
          - { os: ubuntu-latest, target: x86_64, project: bindings/python/wheels/lucem-hist, wheel: lucem-hist, features: "extension-module,hist,wgpu,cuda,hip,cpu" }
          - { os: windows-latest, target: x64, project: bindings/python, wheel: lucem, features: "extension-module,wgpu,cuda,cpu" }
          - { os: windows-latest, target: x64, project: bindings/python/wheels/lucem-hist, wheel: lucem-hist, features: "extension-module,hist,wgpu,cuda,cpu" }
          # No CUDA on macOS
          - { os: macos-latest, target: aarch64, project: bindings/python, wheel: lucem, features: "extension-module,wgpu,cpu" }
          - { os: macos-latest, target: aarch64, project: bindings/python/wheels/lucem-hist, wheel: lucem-hist, features: "extension-module,hist,wgpu,cpu" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ${{ matrix.project }}
          target: ${{ matrix.target }}
          # 2_34: CubeCL's CPU runtime downloads a prebuilt LLVM that needs glibc >= 2.34; the wheel
          # runs on Ubuntu 22.04+, Debian 12+, RHEL 9+
          manylinux: "2_34"
          args: --release --strip --out dist --no-default-features --features ${{ matrix.features }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.wheel }}-${{ matrix.os }}
          path: ${{ matrix.project }}/dist

  # Desktop app wheel (`lucem[app]`). Its own job: a failure here leaves that platform without
  # it and doesn't hold up the rest of the release. Built on the runner itself (the GUI's system
  # libraries are there).
  program-wheels:
    name: Program wheel ${{ matrix.wheel }} (${{ matrix.os }})
    needs: check
    if: vars.PUBLISH_PYPI != 'false'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        wheel: [lucem-app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries for the app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      # glibc 2.35 on Linux (Ubuntu 22.04+, Debian 12+); the system's GUI libraries aren't bundled
      - name: Platform
        id: platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) echo "target=x86_64" >> "$GITHUB_OUTPUT"; echo "manylinux=2_35" >> "$GITHUB_OUTPUT"; echo "args=--auditwheel skip" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "target=x64" >> "$GITHUB_OUTPUT"; echo "manylinux=off" >> "$GITHUB_OUTPUT"; echo "args=" >> "$GITHUB_OUTPUT" ;;
            macOS) echo "target=aarch64" >> "$GITHUB_OUTPUT"; echo "manylinux=off" >> "$GITHUB_OUTPUT"; echo "args=" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python/wheels/${{ matrix.wheel }}
          target: ${{ steps.platform.outputs.target }}
          manylinux: ${{ steps.platform.outputs.manylinux }}
          container: "off"
          args: --release --strip --out dist ${{ steps.platform.outputs.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-${{ matrix.wheel }}-${{ matrix.os }}
          path: bindings/python/wheels/${{ matrix.wheel }}/dist

  sdist:
    name: Source distribution
    needs: check
    if: vars.PUBLISH_PYPI != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: bindings/python/dist

  # The platform-independent `lucem-web` wheel (`py3-none-any`), bundling the static browser WASM
  # build from `web` (`index.html`, `loader.js`, `isolate-sw.js`, `mt/`) for `pip install "lucem[web]"`.
  web-wheel:
    name: Wheel lucem-web (py3-none-any)
    needs: [check, web]
    if: vars.PUBLISH_PYPI != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app
          path: bindings/python/wheels/lucem-web/src/lucem_web/dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build lucem-web wheel
        working-directory: bindings/python/wheels/lucem-web
        run: |
          rm -rf src/lucem_web/dist/engine src/lucem_web/dist/samples
          find src/lucem_web/dist -name "*.br" -delete
          python -m pip install --quiet hatchling build
          python -m build --wheel --outdir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-lucem-web-any
          path: bindings/python/wheels/lucem-web/dist

  publish-crates:
    name: Publish to crates.io
    # Nothing is published unless every wheel and the sdist built (when they are built at all)
    needs: [check, wheels, sdist]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.wheels.result != 'failure' && needs.sdist.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Link with mold (faster than the default linker)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System libraries for GPUI
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Only crates with `publish = true` (the library crates; the app, CLI and MCP server wait for
      # kitchen-agent on crates.io). Crates already on crates.io at this
      # version are left out, so "Re-run failed jobs" finishes a partial publish. Every published
      # crate needs a trusted publisher on crates.io (this repository, workflow release.yml,
      # environment crates-io), or its upload is refused with 403. A crate new to crates.io cannot
      # be created by trusted publishing: it is skipped here, published once by hand from the tag
      # (`cargo publish -p <crate>`), then given its trusted publisher.
      - name: Publish the crates not yet on crates.io
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lucem-core") | .version')
          skip=()
          left=0
          new=()
          agent="lucem-release (github.com/neuro-kitchen/lucem)"
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name'); do
            if curl -sf -A "$agent" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io: skipped"
              skip+=(--exclude "$crate")
            elif ! curl -sf -A "$agent" "https://crates.io/api/v1/crates/$crate" > /dev/null; then
              echo "::warning::$crate is new to crates.io: publish it once by hand from this tag, then add its trusted publisher"
              skip+=(--exclude "$crate")
              new+=("$crate")
            else
              left=$((left + 1))
            fi
          done
          if [ "$left" -eq 0 ]; then
            echo "every crate is already published at $version (new, to publish by hand: ${new[*]:-none})"
            exit 0
          fi
          cargo publish --workspace "${skip[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # `lucem`. PyPI refuses a file that is already there: a re-run skips those.
  publish-pypi:
    name: Publish lucem to PyPI
    needs: [check, wheels, sdist]
    if: vars.PUBLISH_PYPI != 'false'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-lucem-*
          path: dist
          merge-multiple: true
      - name: Keep only lucem wheels (lucem-hist publishes in its own job)
        run: rm -f dist/lucem_hist-*.whl
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # The desktop app, histology, and browser bundle, each in its own environment: PyPI lets one
  # workflow + environment be the pending publisher of only one new project, and a failure here
  # shouldn't hold up the rest of the release.
  publish-pypi-programs:
    name: Publish ${{ matrix.wheel }} to PyPI
    needs: [check, wheels, program-wheels, web-wheel]
    if: vars.PUBLISH_PYPI != 'false'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wheel: lucem-hist, pattern: "wheel-lucem-hist-*", environment: pypi-hist }
          - { wheel: lucem-app, pattern: "program-lucem-app-*", environment: pypi-app }
          - { wheel: lucem-web, pattern: "program-lucem-web-*", environment: pypi-web }
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.pattern }}
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # Prebuilt ML model plugin binaries (`lucem-ml-stardist`, `lucem-ml-instanseg`, `lucem-ml-sam`),
  # shipped as GitHub Release assets with a SHA-256 manifest (`lucem plugins install all`),
  # matching `dsp-kitchen`'s `dspk-cli-sorter` distribution model (never PyPI wheels).
  ml-plugins:
    name: ML plugin binaries (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Link with mold (faster than the default linker)
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ml-plugins-${{ matrix.target }}
          cache-directories: ~/.local/share/tracel
      - name: Build ML plugins
        run: cargo build --release --locked -p lucem-ml-stardist -p lucem-ml-instanseg -p lucem-ml-sam
      - name: Package binaries by target
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p out
          for bin in lucem-ml-stardist lucem-ml-instanseg lucem-ml-sam; do
            cp "target/release/${bin}${ext}" "out/${bin}-${{ matrix.target }}${ext}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ml-plugins-${{ matrix.target }}
          path: out

  github-release:
    name: GitHub release
    needs: [ml-plugins, publish-crates, publish-pypi]
    # PyPI's job is skipped while `PUBLISH_PYPI` is `false`: the release follows the crates
    if: ${{ !cancelled() && needs.publish-crates.result == 'success' && needs.publish-pypi.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach plugin binaries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: ml-plugins-*
          path: out
          merge-multiple: true
      # `lucem plugins install` reads this: per plugin and target, the file, SHA-256 and size
      - name: Write ML plugins manifest
        run: |
          mkdir -p out
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import hashlib, json, os, sys
          version, plugins = sys.argv[1], {}
          for name in sorted(os.listdir("out")):
              path = os.path.join("out", name)
              if not os.path.isfile(path) or name.endswith(".json"):
                  continue
              stem = name.removesuffix(".exe")
              for prog in ("lucem-ml-stardist", "lucem-ml-instanseg", "lucem-ml-sam"):
                  if stem.startswith(prog + "-"):
                      target = stem.removeprefix(prog + "-")
                      digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
                      plugins.setdefault(prog, {})[target] = {
                          "file": name,
                          "sha256": digest,
                          "size": os.path.getsize(path),
                      }
          if plugins:
              json.dump({"version": version, "plugins": plugins}, open("out/lucem-ml-plugins-manifest.json", "w"), indent=2)
              print(json.dumps(plugins, indent=2))
          PY
      # CHANGELOG.md is the one source: this version's section ("## [0.0.2] - date") is the notes
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          cat >> release-notes.md <<'NOTES'

          ## Install

          The library crates from crates.io: `cargo add lucem` (core, io, ops, ml) and the others
          (`lucem-hist`, `lucem-pipeline`, `lucem-view`, `lucem-hub`). The app and the `lucem`
          command build from this tag: `cargo install --git https://github.com/neuro-kitchen/lucem --tag <this tag> lucem-cli`.
          ML model plugins (`lucem-ml-stardist`, `lucem-ml-instanseg`, `lucem-ml-sam`) are attached
          below and installed with `lucem plugins install all`.
          NOTES
          if [ "${{ vars.PUBLISH_PYPI }}" != "false" ]; then
            printf '\nPython: `pip install lucem`, with extras `hist`, `app`, `web` or `all` (`pip install "lucem[all]"`).\n' >> release-notes.md
          fi
      - name: Create the release and attach ML plugin binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
          if ls out/* > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
          fi

  # The page (the threaded browser build), for the container image: built with the nightly that
  # app/lucem-app-web/build.sh pins, and wasm-bindgen of Cargo.lock's version (as dsp-kitchen's).
  web:
    name: Web app (threaded build)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools (nightly, wasm-bindgen of Cargo.lock's version, binaryen, brotli)
        run: |
          toolchain=$(sed -n 's/^TOOLCHAIN="${LUCEM_WEB_TOOLCHAIN:-\(nightly-[0-9-]*\)}"$/\1/p' app/lucem-app-web/build.sh)
          rustup toolchain install "$toolchain" --profile minimal --component rust-src --target wasm32-unknown-unknown
          bindgen=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$bindgen" --locked
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends brotli
          # binaryen from its release, pinned: Ubuntu's package is too old for the module's
          # features (bulk memory, threads)
          curl -sSfL -o /tmp/binaryen.tgz https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz
          echo "0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc  /tmp/binaryen.tgz" | sha256sum -c -
          tar -xzf /tmp/binaryen.tgz -C /tmp && echo /tmp/binaryen-version_130/bin >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The same cache as docs.yml's build of the page (saved on main): the tag starts warm
          shared-key: web-page
      - name: Build
        env:
          LUCEM_BROTLI_Q: "11"
        run: app/lucem-app-web/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app
          path: app/lucem-app-web/dist
          if-no-files-found: error

  # The container image on GitHub's registry: ghcr.io/neuro-kitchen/lucem:<version> and :latest.
  # Target `mesa` of deploy/Containerfile (wgpu on any vendor's GPU through Vulkan, or the CPU),
  # with the page of this run. Pushed after the release exists, and only once the image ran.
  # The package inherits nothing from the repository: make it public once in the organization's
  # package settings.
  # The container image's program, built once here (Ubuntu 22.04's glibc 2.35 runs on the image's
  # Debian 12): the image job copies it in (BINARIES=prebuilt) and compiles nothing
  binaries:
    name: lucem for the container image
    needs: check
    runs-on: ubuntu-22.04
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Link with mold (faster than the default linker)
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: image-binaries
          cache-directories: ~/.local/share/tracel
      - name: Build
        run: |
          cargo build --release --locked -p lucem-cli --no-default-features --features wgpu,cuda,cpu
          mkdir -p image
          cp target/release/lucem image/
          image/lucem --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-binaries
          path: image

  image:
    name: Container image (ghcr.io)
    needs: [binaries, web, github-release]
    if: ${{ !cancelled() && needs.github-release.result == 'success' && needs.web.result == 'success' && needs.binaries.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io/neuro-kitchen/lucem
    env:
      IMAGE: ghcr.io/neuro-kitchen/lucem
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-binaries
          path: deploy/prebuilt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app
          path: app/lucem-app-web/dist
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          chmod +x deploy/prebuilt/lucem
          podman build -f deploy/Containerfile --ignorefile deploy/.containerignore --target mesa \
            --build-arg BINARIES=prebuilt \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${version}" \
            --label "org.opencontainers.image.description=lucem: GPU histology and image analysis (command line, server, the page)" \
            -t "${IMAGE}:${version}" -t "${IMAGE}:latest" .
      # The image must run before it is published: the version it reports is the tag's, and the
      # CPU runtime answers (no GPU on the runner)
      - name: Check the image
        run: |
          version="${GITHUB_REF_NAME#v}"
          podman run --rm "${IMAGE}:${version}" --version | tee /dev/stderr | grep -qF "${version}"
          podman run --rm -e LUCEM_RUNTIME=cpu "${IMAGE}:${version}" doctor
          podman run --rm --entrypoint ls "${IMAGE}:${version}" /usr/share/lucem/web/mt | grep -q lucem_app_web_bg.wasm
      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          podman push "${IMAGE}:${version}"
          podman push "${IMAGE}:latest"
