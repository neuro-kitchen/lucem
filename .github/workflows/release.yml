# Release on a version tag (v0.0.2, ...), as dsp-kitchen and kitchen do: check the tag against the workspace
# version, package the publishable crates and build the Python wheels and sdist, then publish to
# crates.io and PyPI through trusted publishing (no stored tokens). The publish jobs run in the
# GitHub environments `crates-io` and `pypi`, which only accept `v*` tags and wait for a required
# reviewer's approval (the app and each model plugin publish from their own: `pypi-app`,
# `pypi-ml-stardist`, `pypi-ml-sam`, `pypi-ml-instanseg`); the registries only accept tokens from this workflow and
# those environments. Then the GitHub release of the tag, with this version's CHANGELOG.md section as
# its notes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check version and package crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The workspace includes the GPUI app (not published); resolving and checking it needs these
      - name: System libraries for GPUI
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - name: Tag matches the workspace version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lucem-core") | .version')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != workspace version ${version}"; exit 1; }
      - name: CHANGELOG.md has this version's section
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: lucem's extras pin this version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lucem-core") | .version')
          wrong=$(grep -oE '"lucem-[a-z-]+==[^"]+"' bindings/python/pyproject.toml | grep -v "==${version}\"" || true)
          test -z "$wrong" || { echo "bindings/python/pyproject.toml pins $wrong, the workspace is ${version}"; exit 1; }
      - name: Package and verify the publishable crates
        run: cargo publish --dry-run --workspace
      # Nothing is published with a known vulnerability, a yanked crate or a licence not allowed
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The Python packages (bindings/python): `lucem` is the core; `lucem-hist` is the same extension
  # built with histology. abi3, so one wheel per platform serves every CPython >= 3.12.
  wheels:
    name: Wheel ${{ matrix.wheel }} (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # HIP (AMD): Linux only in cubecl-hip; compiled in, not run (no AMD GPU to test on)
          - { os: ubuntu-latest, target: x86_64, project: bindings/python, wheel: lucem, features: "extension-module,wgpu,cuda,hip,cpu" }
          - { os: ubuntu-latest, target: x86_64, project: bindings/python/wheels/lucem-hist, wheel: lucem-hist, features: "extension-module,hist,wgpu,cuda,hip,cpu" }
          - { os: windows-latest, target: x64, project: bindings/python, wheel: lucem, features: "extension-module,wgpu,cuda,cpu" }
          - { os: windows-latest, target: x64, project: bindings/python/wheels/lucem-hist, wheel: lucem-hist, features: "extension-module,hist,wgpu,cuda,cpu" }
          # No CUDA on macOS
          - { os: macos-latest, target: aarch64, project: bindings/python, wheel: lucem, features: "extension-module,wgpu,cpu" }
          - { os: macos-latest, target: aarch64, project: bindings/python/wheels/lucem-hist, wheel: lucem-hist, features: "extension-module,hist,wgpu,cpu" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: ${{ matrix.project }}
          target: ${{ matrix.target }}
          # 2_34: CubeCL's CPU runtime downloads a prebuilt LLVM that needs glibc >= 2.34; the wheel
          # runs on Ubuntu 22.04+, Debian 12+, RHEL 9+
          manylinux: "2_34"
          args: --release --strip --out dist --no-default-features --features ${{ matrix.features }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.wheel }}-${{ matrix.os }}
          path: ${{ matrix.project }}/dist

  # Programs in wheels: the desktop app (`lucem[app]`) and the model plugins (`lucem[stardist]`,
  # `lucem[sam]`). Their own job: a failure here leaves that platform without them and doesn't hold
  # up the rest of the release. Built on the runner itself (the GUI's system libraries are there).
  program-wheels:
    name: Program wheel ${{ matrix.wheel }} (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        wheel: [lucem-app, lucem-ml-stardist, lucem-ml-sam, lucem-ml-instanseg]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries for the app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      # glibc 2.35 on Linux (Ubuntu 22.04+, Debian 12+); the system's GUI libraries aren't bundled
      - name: Platform
        id: platform
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) echo "target=x86_64" >> "$GITHUB_OUTPUT"; echo "manylinux=2_35" >> "$GITHUB_OUTPUT"; echo "args=--auditwheel skip" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "target=x64" >> "$GITHUB_OUTPUT"; echo "manylinux=off" >> "$GITHUB_OUTPUT"; echo "args=" >> "$GITHUB_OUTPUT" ;;
            macOS) echo "target=aarch64" >> "$GITHUB_OUTPUT"; echo "manylinux=off" >> "$GITHUB_OUTPUT"; echo "args=" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python/wheels/${{ matrix.wheel }}
          target: ${{ steps.platform.outputs.target }}
          manylinux: ${{ steps.platform.outputs.manylinux }}
          container: "off"
          args: --release --strip --out dist ${{ steps.platform.outputs.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: program-${{ matrix.wheel }}-${{ matrix.os }}
          path: bindings/python/wheels/${{ matrix.wheel }}/dist

  sdist:
    name: Source distribution
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: bindings/python/dist

  publish-crates:
    name: Publish to crates.io
    # Nothing is published unless every wheel and the sdist built
    needs: [check, wheels, sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: System libraries for GPUI
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Only crates with `publish = true` (the library crates; the app, CLI and MCP server wait for
      # kitchen-agent on crates.io). Crates already on crates.io at this
      # version are left out, so "Re-run failed jobs" finishes a partial publish. Every published
      # crate needs a trusted publisher on crates.io (this repository, workflow release.yml,
      # environment crates-io), or its upload is refused with 403. A crate new to crates.io cannot
      # be created by trusted publishing: it is skipped here, published once by hand from the tag
      # (`cargo publish -p <crate>`), then given its trusted publisher.
      - name: Publish the crates not yet on crates.io
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lucem-core") | .version')
          skip=()
          left=0
          new=()
          agent="lucem-release (github.com/neuro-kitchen/lucem)"
          for crate in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name'); do
            if curl -sf -A "$agent" "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io: skipped"
              skip+=(--exclude "$crate")
            elif ! curl -sf -A "$agent" "https://crates.io/api/v1/crates/$crate" > /dev/null; then
              echo "::warning::$crate is new to crates.io: publish it once by hand from this tag, then add its trusted publisher"
              skip+=(--exclude "$crate")
              new+=("$crate")
            else
              left=$((left + 1))
            fi
          done
          if [ "$left" -eq 0 ]; then
            echo "every crate is already published at $version (new, to publish by hand: ${new[*]:-none})"
            exit 0
          fi
          cargo publish --workspace "${skip[@]}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # `lucem` and `lucem-hist`. PyPI refuses a file that is already there: a re-run skips those.
  publish-pypi:
    name: Publish lucem and lucem-hist to PyPI
    needs: [check, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # The app and the model plugins, each in its own environment: PyPI lets one workflow +
  # environment be the pending publisher of only one new project, and a failure here shouldn't
  # hold up the rest of the release.
  publish-pypi-programs:
    name: Publish ${{ matrix.wheel }} to PyPI
    needs: [check, program-wheels]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wheel: lucem-app, environment: pypi-app }
          - { wheel: lucem-ml-stardist, environment: pypi-ml-stardist }
          - { wheel: lucem-ml-sam, environment: pypi-ml-sam }
          - { wheel: lucem-ml-instanseg, environment: pypi-ml-instanseg }
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: program-${{ matrix.wheel }}-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  github-release:
    name: GitHub release
    needs: [publish-crates, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CHANGELOG.md is the one source: this version's section ("## [0.0.2] - date") is the notes
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          cat >> release-notes.md <<'NOTES'

          ## Install

          The library crates from crates.io: `cargo add lucem` (core, io, ops, ml) and the others
          (`lucem-hist`, `lucem-pipeline`, `lucem-view`, `lucem-hub`). Python: `pip install lucem`,
          with extras `hist`, `app`, `stardist`, `sam`, `instanseg`, `ml` or `all` (`pip install "lucem[all]"`). The app and the `lucem`
          command build from this tag: `cargo install --git https://github.com/neuro-kitchen/lucem --tag <this tag> lucem-cli`.
          NOTES
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
