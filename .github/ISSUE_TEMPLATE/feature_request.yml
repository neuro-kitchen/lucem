name: Feature request
description: An operation, format, tool or improvement you need
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task, not only the function. What do you use today (Fiji, scikit-image, …)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What lucem could offer
      description: The operator, tool, pipeline node or binding you have in mind, with its parameters if you know them.
  - type: dropdown
    id: interface
    attributes:
      label: Where you would use it
      multiple: true
      options:
        - Desktop app
        - Pipelines
        - Rust crates
        - Python
  - type: textarea
    id: references
    attributes:
      label: References
      description: Papers, upstream code or documentation the behaviour should follow (with their licences, if code).
