[package]
name = "lucem-py"
description = "The `lucem` Python extension: PyO3 bindings of the lucem crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
# Set by maturin when it builds the wheel; off for `cargo` builds of the workspace (linker)
extension-module = ["pyo3/extension-module"]

[dependencies]
# abi3: one wheel per platform serves every CPython >= 3.12
pyo3 = { workspace = true, features = ["abi3-py312"] }
numpy.workspace = true
