[package]
name = "lucem-py"
description = "The `lucem` Python extension: PyO3 bindings of the lucem crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
# wgpu, cuda and cpu, and hip on Linux in the release wheels; histology in for development builds
default = ["wgpu", "cuda", "cpu", "hist"]
# Histology: the `lucem-hist` wheel is this extension built with it; the `lucem` wheel without
hist = ["dep:lucem-py-hist"]
# Set by maturin when it builds the wheel; off for `cargo` builds of the workspace (linker)
extension-module = ["pyo3/extension-module"]
wgpu = ["lucem-py-core/wgpu", "lucem-py-hist?/wgpu"]
cpu = ["lucem-py-core/cpu", "lucem-py-hist?/cpu"]
cuda = ["lucem-py-core/cuda", "lucem-py-hist?/cuda"]
hip = ["lucem-py-core/hip", "lucem-py-hist?/hip"]

[dependencies]
lucem-py-core.workspace = true
lucem-py-hist = { workspace = true, optional = true }
# abi3: one wheel per platform serves every CPython >= 3.12
pyo3 = { workspace = true, features = ["abi3-py312"] }
