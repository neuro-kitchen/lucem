[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lucem-web"
version = "0.0.6"
description = "The lucem browser WASM app bundle: install with pip install 'lucem[web]' or uv add 'lucem[web]'"
readme = "README.md"
authors = [{ name = "jesusdpa1" }]
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"

[project.urls]
Repository = "https://github.com/neuro-kitchen/lucem"

[tool.hatch.build.targets.wheel]
packages = ["src/lucem_web"]
