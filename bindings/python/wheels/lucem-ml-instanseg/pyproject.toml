[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "lucem-ml-instanseg"
dynamic = ["version"]
description = "lucem's InstanSeg (nuclei as pixel embeddings, on Burn) model plugin: install with pip install lucem[instanseg]"
readme = "README.md"
authors = [{ name = "jesusdpa1" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"

[project.urls]
Repository = "https://github.com/neuro-kitchen/lucem"

[tool.maturin]
manifest-path = "../../../../plugins/ml/lucem-ml-instanseg/Cargo.toml"
bindings = "bin"
