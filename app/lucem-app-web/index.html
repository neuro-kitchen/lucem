<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lucem</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80' fill='none'%3E%3Crect width='80' height='80' rx='18' fill='%2314171a'/%3E%3Cpath d='M24 16 C39 10 58 14 67 27 C74 37 68 56 54 65 C41 72 24 73 18 62 C13 53 8 44 12 31 C15 22 18 19 24 16 Z' stroke='%2352b7be' stroke-width='3.6' stroke-linecap='round'/%3E%3Cpath d='M26 37 C32 32 43 34 45 43 C47 51 39 58 30 56 C22 54 21 42 26 37 Z' stroke='%23edf1f2' stroke-width='3.2' stroke-linecap='round'/%3E%3Ccircle cx='54' cy='31' r='4.5' stroke='%238b959a' stroke-width='2.6'/%3E%3Ccircle cx='53' cy='51' r='3.5' stroke='%238b959a' stroke-width='2.6'/%3E%3C/svg%3E" />
    <style>
      @font-face {
        font-family: "Matemasie";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("./matemasie-lucem.woff2") format("woff2");
      }
      :root {
        color-scheme: dark light;
        --bg: #14171a;
        --fg: #edf1f2;
        --muted: #8b959a;
        --accent: #2b7f86;
        --accent-2: #52b7be;
        --track: rgba(255, 255, 255, 0.08);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f3e8;
          --fg: #1e262b;
          --muted: #66706d;
          --accent: #23747b;
          --accent-2: #2b7f86;
          --track: rgba(0, 0, 0, 0.08);
        }
      }
      html, body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(620px circle at 50% 44%, rgba(43, 127, 134, 0.16), transparent 65%),
          var(--bg);
        color: var(--fg);
        overflow: hidden;
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #note { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; }
      #note > div { max-width: 520px; text-align: center; }
      #note .loader { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      #note .mark {
        width: 72px;
        height: 72px;
        overflow: visible;
        animation: lucem-breathe 2.4s ease-in-out infinite;
        will-change: transform, opacity;
      }
      #note .cell-dot {
        animation: lucem-dot 2.4s ease-in-out infinite;
        will-change: opacity;
      }
      #note .brand {
        font-family: "Matemasie", system-ui, sans-serif;
        font-style: normal;
        font-size: 34px;
        font-weight: 400;
        letter-spacing: 0.02em;
        line-height: 1.1;
        margin: 0;
        color: var(--fg);
      }
      #note .sub {
        font-size: 12.5px;
        letter-spacing: 0.02em;
        margin: -4px 0 0;
        color: var(--muted);
      }
      #note .bar { width: 180px; height: 3px; border-radius: 999px; background: var(--track); overflow: hidden; }
      #note .bar-fill {
        width: 44%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        animation: lucem-slide 1.4s ease-in-out infinite;
      }
      #note h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; text-align: left; }
      #note p, #note li { color: var(--muted); }
      #note ul { text-align: left; }
      #note code { color: var(--fg); font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; }
      #note a { color: var(--accent-2); text-decoration: none; }
      #note a:hover { text-decoration: underline; }
      @keyframes lucem-breathe {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes lucem-dot {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="note">
      <div class="loader">
        <svg class="mark" viewBox="0 0 80 80" fill="none" aria-hidden="true">
          <defs>
            <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
              <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" result="noise" />
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.15" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          </defs>
          <g filter="url(#pencil)" stroke-linecap="round" stroke-linejoin="round">
            <path class="cell-outline" d="M24 16 C39 10, 58 14, 67 27 C74 37, 68 56, 54 65 C41 72, 24 73, 18 62 C13 53, 8 44, 12 31 C15 22, 18 19, 24 16 Z" stroke="var(--accent-2)" stroke-width="2.1" />
            <path class="cell-nucleus" d="M26 37 C32 32, 43 34, 45 43 C47 51, 39 58, 30 56 C22 54, 21 42, 26 37 Z" stroke="var(--fg)" stroke-width="1.9" />
            <path class="cell-organelle" d="M48 25 C55 24, 60 28, 60 34 C59 38, 53 38, 49 33 C46 30, 45 26, 48 25 Z" stroke="var(--muted)" stroke-width="1.5" />
            <path class="cell-organelle" d="M51 45 C56 46, 59 51, 56 56 C52 59, 47 56, 48 50 C48 47, 49 45, 51 45 Z" stroke="var(--muted)" stroke-width="1.5" />
            <circle class="cell-dot" cx="35" cy="23" r="1.6" fill="var(--accent-2)" />
            <circle class="cell-dot" cx="20" cy="30" r="1.4" fill="var(--accent-2)" />
            <circle class="cell-dot" cx="62" cy="43" r="1.5" fill="var(--accent-2)" />
            <circle class="cell-dot" cx="42" cy="63" r="1.5" fill="var(--accent-2)" />
          </g>
        </svg>
        <p class="brand">Lucem</p>
        <p class="sub">Preparing workspace…</p>
      </div>
    </div>
    <script type="module" src="./loader.js"></script>
  </body>
</html>
