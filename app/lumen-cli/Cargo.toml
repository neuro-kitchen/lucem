[package]
name = "lumen-cli"
description = "Command-line interface of lumen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lumen"
path = "src/main.rs"

[features]
default = ["wgpu", "cuda", "cpu"]
wgpu = ["lumen-core/wgpu", "lumen-ops/wgpu"]
cpu = ["lumen-core/cpu", "lumen-ops/cpu"]
cuda = ["lumen-core/cuda", "lumen-ops/cuda"]
hip = ["lumen-core/hip", "lumen-ops/hip"]

[dependencies]
lumen-ml.workspace = true
image.workspace = true
lumen-core = { workspace = true, features = ["compute"] }
lumen-io.workspace = true
lumen-hist = { workspace = true, features = ["wgpu", "cuda", "cpu"] }
lumen-ops.workspace = true
lumen-pipeline.workspace = true
# `lumen mcp`, and the runners `lumen ops`, `run` and `session run` share with it
lumen-mcp.workspace = true
lumen-stream.workspace = true
rustls.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
