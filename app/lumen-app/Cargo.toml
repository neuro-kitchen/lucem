[package]
name = "lumen-app"
description = "Desktop application of lumen (GPUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lumen-app"
path = "src/main.rs"

[dependencies]
arrow.workspace = true
gpui-kit.workspace = true
lumen-core = { workspace = true, default-features = false, features = ["compute", "wgpu", "cuda", "cpu"] }
lumen-io.workspace = true
lumen-ops.workspace = true
lumen-pipeline.workspace = true
lumen-view.workspace = true
polars.workspace = true
serde.workspace = true
