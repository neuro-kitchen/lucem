[package]
name = "lucem-app"
description = "Lucem desktop application (GPUI): the app core as a binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lucem-app"
path = "src/main.rs"

[features]
# The app's spans (tiles read and coloured, the canvas's plan and uploads) in Tracy: run Tracy,
# then `cargo run -p lucem-app --profile validate --features tracy`
tracy = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-tracy"]

[dependencies]
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-tracy = { workspace = true, optional = true }
gpui-kit.workspace = true
kitchen-ui.workspace = true
lucem-app-core.workspace = true
