[package]
name = "lucem-app-core"
description = "Lucem app core: the workstation shell, project document and commands, image canvas and tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
rayon.workspace = true
geo.workspace = true
# Measurement tables (Analyze): region features → Arrow / Polars
arrow.workspace = true
async-channel.workspace = true
gpui-kit.workspace = true
kitchen-ui.workspace = true
# The shared frame: command registry, menus, search, status bar, Settings, jobs
kitchen-shell.workspace = true
# The Agents workspace: the chat (an ACP agent) and lucem's commands served over MCP
kitchen-agent.workspace = true
sysinfo.workspace = true
lucem-core = { workspace = true, default-features = false, features = ["compute", "wgpu", "cuda", "cpu"] }
lucem-io.workspace = true
flate2.workspace = true
# Histology workflows (stains, tissue, cells, classifiers)
lucem-hist = { workspace = true, features = ["wgpu", "cuda", "cpu"] }
# Machine-learning plugins: the contract only (the models run in separate programs)
lucem-ml.workspace = true
lucem-ops = { workspace = true, features = ["wgpu", "cuda", "cpu"] }
lucem-pipeline.workspace = true
lucem-view.workspace = true
polars.workspace = true
schemars.workspace = true
# The agent's snapshot of the shown image (PNG)
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`)
gpui-kit = { workspace = true, features = ["test-support"] }
