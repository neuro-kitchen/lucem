[package]
name = "lucem-app-core"
description = "Lucem app core: the workstation shell, project document and commands, image canvas and tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
rayon.workspace = true
geo.workspace = true
# Measurement tables (Analyze): region features → Arrow / Polars
arrow.workspace = true
async-channel.workspace = true
gpui-kit.workspace = true
kitchen-ui.workspace = true
# The shared frame: command registry, menus, search, status bar, Settings, jobs
kitchen-shell.workspace = true
lucem-io.workspace = true
flate2.workspace = true
# Histology workflows (stains, tissue, cells, classifiers): its compute below, per target
lucem-hist.workspace = true
lucem-ops.workspace = true
lucem-core = { workspace = true, default-features = false, features = ["compute"] }
# Instant that works in a browser page (std's panics there); std's elsewhere
web-time.workspace = true
# Spans for profiling (Tracy with lucem-app's `tracy` feature)
tracing.workspace = true
toml_edit.workspace = true
# Machine-learning plugins: the contract only (the models run in separate programs)
lucem-ml.workspace = true
lucem-pipeline.workspace = true
lucem-session.workspace = true
lucem-view.workspace = true
lucem-table.workspace = true
schemars.workspace = true
# The agent's snapshot of the shown image (PNG)
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow = "1"
lsp-types = "0.97"

# A computer: every compute runtime; images on paired servers over QUIC (lucem:// paths)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
sysinfo.workspace = true
lucem-core = { workspace = true, default-features = false, features = ["compute", "wgpu", "cuda", "cpu"] }
lucem-hist = { workspace = true, features = ["wgpu", "cuda", "cpu"] }
lucem-ops = { workspace = true, features = ["wgpu", "cuda", "cpu"] }
lucem-stream = { workspace = true, features = ["native"] }

# A browser page: no compute of its own (the server computes), the page's server over
# WebTransport or a WebSocket
[target.'cfg(target_family = "wasm")'.dependencies]
lucem-stream = { workspace = true, default-features = false, features = ["web"] }
# The session kept in the browser's storage between reloads + same-origin server API fetch
web-sys = { workspace = true, features = ["Window", "Storage", "Request", "RequestInit", "Response", "Headers"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[dev-dependencies]
# Headless UI tests (`#[gpui_kit::test]`)
gpui-kit = { workspace = true, features = ["test-support"] }
