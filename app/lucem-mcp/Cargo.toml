[package]
name = "lucem-mcp"
description = "lucem's tools for agents (Model Context Protocol): operations, images, histology steps, pipelines, sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
lucem-core = { workspace = true, features = ["compute"] }
lucem-io.workspace = true
lucem-hist = { workspace = true, features = ["wgpu", "cuda", "cpu"] }
lucem-pipeline.workspace = true
# The MCP server (official Rust SDK): tools over stdio
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
