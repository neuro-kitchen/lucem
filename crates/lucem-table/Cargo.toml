[package]
name = "lucem-table"
description = "Tables for lucem as Polars data frames: the one place that depends on Polars"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[features]
default = ["polars"]
# Polars (data frames, the table view): off in a browser build (Polars does not build for wasm32)
polars = ["dep:polars"]

[dependencies]
polars = { workspace = true, optional = true }
