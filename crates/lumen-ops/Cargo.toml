[package]
name = "lumen-ops"
description = "GPU image operations for lumen, written once in CubeCL (filters, morphology, thresholds, statistics)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
default = ["wgpu", "cuda", "cpu"]
wgpu = ["lumen-core/wgpu", "cubecl/wgpu"]
cpu = ["lumen-core/cpu", "cubecl/cpu"]
cuda = ["lumen-core/cuda", "cubecl/cuda"]
hip = ["lumen-core/hip", "cubecl/hip"]

[dependencies]
arrow.workspace = true
cubecl.workspace = true
lumen-core = { workspace = true, default-features = false, features = ["compute"] }
num-traits.workspace = true
polars.workspace = true
serde.workspace = true
thiserror.workspace = true
