[project]
name = "lumen-dev"
version = "0.1.0"
description = "Development environment of the lumen repository (playground scripts, tests); the Python package is bindings/python"
readme = "README.md"
authors = [{ name = "jesusdpa1" }]
requires-python = ">=3.12"
dependencies = [
    "lumen",
    "numpy>=2.5",
]

[tool.uv]
# Not a package itself: it installs lumen (bindings/python) editable, built by maturin
package = false

[tool.uv.sources]
lumen = { path = "bindings/python", editable = true }

[tool.ruff]
src = ["bindings/python/python"]
line-length = 120

[dependency-groups]
dev = ["maturin>=1.16", "pytest>=9.2", "ruff>=0.17"]
