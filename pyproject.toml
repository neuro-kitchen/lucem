[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "lumen"
version = "0.1.0"
description = "Fluorescence brain-section analysis in Rust (CubeCL, Burn, GPUI), with a Python SDK"
readme = "README.md"
authors = [{ name = "jesusdpa1" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
]

[tool.maturin]
manifest-path = "lumen_py/Cargo.toml"
module-name = "lumen_bindings.lumen_bindings"
python-source = "lumen_py"
features = ["extension-module"]

[tool.ruff]
src = ["lumen_py/lumen_bindings", "lumen_py/lumen"]

[dependency-groups]
dev = ["maturin>=1.15", "pytest>=9.0", "ruff>=0.16"]
