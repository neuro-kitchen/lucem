[package]
name = "lumen-stream"
description = "Serving lumen images over QUIC and TLS, to enrolled clients only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
lumen-core = { workspace = true, default-features = false }
lumen-io.workspace = true
quinn.workspace = true
rcgen = { workspace = true, features = ["x509-parser"] }
# Pairing: a short code instead of a file handed over (SPAKE2, HMAC-SHA-256)
spake2.workspace = true
hmac.workspace = true
getrandom.workspace = true
rustls.workspace = true
rustls-pki-types = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
