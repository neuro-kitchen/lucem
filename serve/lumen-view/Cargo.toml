[package]
name = "lumen-view"
description = "Viewing support for lumen: multiscale pyramids and tiles for display"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
async-channel.workspace = true
cubecl.workspace = true
gpui-kit.workspace = true
image.workspace = true
lumen-core = { workspace = true, default-features = false, features = ["compute"] }
lumen-io.workspace = true
serde.workspace = true
smallvec.workspace = true

[dev-dependencies]
lumen-core = { workspace = true, features = ["compute", "wgpu", "cuda", "cpu"] }
