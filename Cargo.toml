[workspace]
resolver = "2"
members = [
    # Image-processing library
    "crates/lumen",
    "crates/lumen-core",
    "crates/lumen-io",
    "crates/lumen-ops",
    "crates/lumen-ml",
    # Histology workflows (stains, tissue, cells, classifiers, densities, export)
    "crates/lumen-hist",
    # Verified downloads of published artifacts (model weights); all network access of the models
    "hub/lumen-hub",
    # Models, one crate per upstream family, each under its upstream's licence (as dsp-kitchen's
    # sorters); the app never links them: plugins/ml programs run them
    "models/sam",
    "models/stardist",
    # Pipeline engine
    "engine/lumen-pipeline",
    # Serving
    "serve/lumen-view",
    "serve/lumen-stream",
    # Front ends
    "app/lumen-cli",
    "app/lumen-app-core",
    "app/lumen-app",
    # Plugins: ml/ programs the app and the command line run (one per model family, never
    # linked, so ONNX Runtime and model licences stay out of lumen itself)
    "plugins/ml/lumen-ml-sam",
    "plugins/ml/lumen-ml-stardist",
    # Bindings
    "bindings/python/lumen-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"   # burn 0.22 minimum
authors = ["jesusdpa1"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Workspace crates
lumen-core = { path = "crates/lumen-core", version = "0.1.0", default-features = false }
lumen-io = { path = "crates/lumen-io", version = "0.1.0" }
lumen-ops = { path = "crates/lumen-ops", version = "0.1.0", default-features = false }
lumen-ml = { path = "crates/lumen-ml", version = "0.1.0" }
lumen-hist = { path = "crates/lumen-hist", version = "0.1.0", default-features = false }
lumen-pipeline = { path = "engine/lumen-pipeline", version = "0.1.0" }
lumen-view = { path = "serve/lumen-view", version = "0.1.0" }
lumen-stream = { path = "serve/lumen-stream", version = "0.1.0" }
lumen-app-core = { path = "app/lumen-app-core", version = "0.1.0" }

# Latest stable versions on crates.io 2026-11-08 (cubecl 0.12 / burn 0.23 are pre-releases only);
# add each to a crate with `<name>.workspace = true`.
# Compute (as in dsp-kitchen)
# `persistence`: autotune decisions survive the process; with the compiled-kernel cache turned on
# in the runtime setup (.knowledge/gpu/01-compute-layer.md), start-up drops from minutes to seconds
cubecl = { version = "0.11.4", default-features = false, features = ["std", "stdlib", "persistence"] }
burn = { version = "0.22.1", default-features = false }
# Python bindings (built by maturin, see pyproject.toml)
pyo3 = { version = "0.30.1" }
numpy = "0.30.0"
# UI: GPUI through gpui-kit (re-exports gpui, gpui-base, gpui-component)
gpui-kit = "0.9.1"
# Analytics & columnar data (Arrow + Polars)
arrow = { version = "60.1.0", default-features = false }
polars = { version = "0.55.2", default-features = false, features = ["lazy", "fmt", "parquet"] }
# Image I/O
image = "0.25.10"
tiff = "0.11.3"
# Common
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
num-traits = "0.2.19"
smallvec = "1.16.5"
# Serving: QUIC and TLS, as in dsp-kitchen
quinn = "0.11.12"
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.16.0"
sha2 = "0.11.1"
# Machine learning plugins: ONNX Runtime loaded at run time (no download at build, nothing in the
# app); HTTP for verified weight downloads (lumen-hub)
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std", "api-31", "cuda"] }
ureq = "3.5.1"
flate2 = "1.1.11"
tar = "0.4.46"
lumen-hub = { path = "hub/lumen-hub", version = "0.1.0" }
lumen-model-sam = { path = "models/sam", version = "0.1.0" }
lumen-model-stardist = { path = "models/stardist", version = "0.1.0", default-features = false }
# Keras weights (HDF5) read without the C library, written as safetensors
hdf5-reader = "0.12.1"
# Parallel loops over host data (objects, chunks): work stealing
rayon = "1.12.0"
# Boolean operations on shapes (add, subtract, intersect, xor)
geo = "0.33.1"
safetensors = "0.8.0"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# Background results into the UI; JSON Schema of the project document (for agents / MCP)
async-channel = "2.5.0"
schemars = "1.2.3"

# The one development build (as in dsp-kitchen): tests, benchmarks, the CLI and the Python extension
# use `--profile validate`. Our crates lightly optimized, incremental, with debug assertions and
# overflow checks; dependencies (CubeCL, wgpu, …) fully optimized and cached. Kernels are compiled by
# CubeCL at run time, so device timings do not depend on this profile.
[profile.validate]
inherits = "release"
opt-level = 1
codegen-units = 256
incremental = true
debug-assertions = true
overflow-checks = true
debug = "line-tables-only"

[profile.validate.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Line tables only (panics and backtraces still name file and line): full debug info filled
# dsp-kitchen's target/ with 363 GB. For a debugger session: CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"
# Our crates lightly optimized: tile decoding, compositing and canvas paths run every frame, and at
# opt-level 0 the image viewer lags. Incremental builds stay fast.
opt-level = 1

# Dependencies fully optimized (compiled once, cached): GPUI, wgpu, CubeCL, polars, image.
[profile.dev.package."*"]
opt-level = 3

# wgpu-core's lock tracing (debug assertions only) aborts when a CubeCL device runner shuts down at
# exit (lumen-core `shutdown_devices`).
[profile.dev.package.wgpu-core]
debug-assertions = false

# wgpu-types picks the instance flags: with debug assertions, `InstanceFlags::default()` turns on
# the Vulkan validation layer, whose device teardown raced NVIDIA's shader-compiler threads at exit.
# Validation stays opt-in (cubecl-wgpu `vulkan-validate`).
[profile.dev.package.wgpu-types]
debug-assertions = false
