# cargo-deny: supply-chain checks run in CI (`cargo deny check`) and locally.
# - advisories: no crate with a known vulnerability (RustSec), none yanked;
# - licenses: only the licences listed (lumen itself is MIT OR Apache-2.0);
# - bans: no wildcard version requirements;
# - sources: crates.io only (no git dependencies, no other registries).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# A crate no longer maintained is an error when lumen depends on it directly; deep in the GUI
# (fonts, D-Bus) and Burn stacks it is the upstream's to replace, and CI would fail on every one
unmaintained = "workspace"
ignore = [
    # quick-xml < 0.41: quadratic time on a start tag with many attributes, and unbounded
    # namespace declarations in NsReader (denial of service, both).
    # Reached only through polars' object_store (cloud storage responses); lumen parses no
    # untrusted XML with it. object_store 0.13 pins quick-xml 0.39 and polars 0.55.2 (the newest)
    # uses object_store 0.13: remove this when polars moves to object_store 0.14.
    { id = "RUSTSEC-2026-0194", reason = "only via polars' object_store; no fixed version reachable yet" },
    { id = "RUSTSEC-2026-0195", reason = "only via polars' object_store; no fixed version reachable yet" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    # Permissive (OSI approved); libfuzzer-sys, part of the dependency graph with all features
    "NCSA",
]

# No licence field in its manifest; its LICENSE file is the Apache License 2.0
[[licenses.clarify]]
crate = "cfg_block"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0xfb72a18 }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
